name: Node CI

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - '*.*.*'

permissions:
  id-token: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ '22', '24', '26' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup NodeJS
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Dependencies Install
        run: npm ci
        env:
          CI: true

      - name: Test
        run: npm run test
        env:
          CI: true

      - name: Codecov
        if: matrix.node-version == '24'
        uses: codecov/codecov-action@v7.0.0
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  publish:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    strategy:
      matrix:
        node-version: [ '24' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup NodeJS
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package version
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PACKAGE_VERSION" != "$TAG_NAME" ]; then
            echo "Tag $TAG_NAME does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Dependencies Install
        run: npm ci
        env:
          CI: true

      - name: Build
        run: npm run build:no-test:ci
        env:
          CI: true

      - name: Pre-Publish - install package globally
        run: |
          FOR /F "tokens=*" %%g IN ('node -e "console.log(require(""./package.json"").version)"') do (SET VERSION=%%g)
          npm i -g fix-lockfile-integrity-%VERSION%.tgz
        shell: cmd

      - name: Pre-Publish - test package globally
        run: |
          fix-lockfile-integrity
        shell: cmd

      - name: Publish
        run: npm publish --provenance --tag ${{ contains(github.ref_name, '-') && 'beta' || 'latest' }}

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: fix-lockfile-integrity-*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
